<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="telegram-webapp-theme" content="dark">
  <title>🧾 Дашборд чеков</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>const RECEIPT_DATA = {"total_receipts": 2, "total_spent": 2116.0, "by_store": [["и ИЯ", 1, 1542.0], ["Продуктовый магазин", 1, 574.0]], "top_items": [["Колбаса Докторская Черкашин и", 1, 310.0], ["une грудки цыплёнка-бройлера", 1, 255.0], ["Тоник Биттер Лемон Bitter Rich", 1, 238.0], ["Лапша Ottogi Джин Рамён острый", 1, 169.0], ["Семечки полосатые Or Мартина", 1, 149.0], ["Семечки полосатые От Мартина", 1, 129.0], ["Огурцы короткоплодные", 1, 113.0], ["Яйцо Cl Боровская птицефабрика", 1, 109.0], ["Соус Кавказский Mivimex", 1, 89.0], ["Молоко 3,2% Наша Маша", 1, 80.0]], "recent": [["23.07.2026", "и ИЯ", 1542.0], ["20.07.2026", "Продуктовый магазин", 574.0]]};</script>
  <style>
    :root {
      --bg-primary: #0a1628;
      --bg-secondary: #111d35;
      --bg-card: #162240;
      --accent-green: #2ecc71;
      --accent-orange: #f39c12;
      --accent-blue: #3498db;
      --text-primary: #ecf0f1;
      --text-secondary: #8899aa;
      --border: rgba(255,255,255,0.06);
      --radius: 14px;
      --shadow: 0 4px 24px rgba(0,0,0,0.3);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      padding: 16px;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      padding: 16px;
      background: var(--bg-secondary);
      border-radius: var(--radius);
      border: 1px solid var(--border);
    }
    .header-icon {
      font-size: 36px;
      background: linear-gradient(135deg, var(--accent-green), #27ae60);
      border-radius: 12px;
      width: 52px; height: 52px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .header h1 {
      font-size: 20px;
      font-weight: 700;
      color: var(--text-primary);
    }
    .header .subtitle {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 2px;
    }
    .refresh-btn {
      margin-left: auto;
      background: var(--accent-blue);
      border: none;
      color: #fff;
      width: 36px; height: 36px;
      border-radius: 10px;
      font-size: 18px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: opacity 0.2s;
    }
    .refresh-btn:active { opacity: 0.7; }
    .refresh-btn.spinning { animation: spin 0.6s linear; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* KPI Cards */
    .kpi-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }
    .kpi-card {
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 16px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
    }
    .kpi-card .kpi-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }
    .kpi-card .kpi-value {
      font-size: 28px;
      font-weight: 800;
    }
    .kpi-card.green .kpi-value { color: var(--accent-green); }
    .kpi-card.orange .kpi-value { color: var(--accent-orange); }

    /* Section Card */
    .section {
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 14px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
    }
    .section-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--accent-green);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .section-title .icon { font-size: 18px; }

    /* Store List */
    .store-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }
    .store-item:last-child { border-bottom: none; }
    .store-name {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      margin-right: 10px;
    }
    .store-meta {
      font-size: 11px;
      color: var(--text-secondary);
      white-space: nowrap;
    }
    .store-total {
      font-size: 15px;
      font-weight: 700;
      color: var(--accent-orange);
      white-space: nowrap;
      margin-left: 10px;
    }

    /* Top Items */
    .item-row {
      display: flex;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
      gap: 10px;
    }
    .item-row:last-child { border-bottom: none; }
    .item-rank {
      width: 24px; height: 24px;
      background: var(--bg-secondary);
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-secondary);
      flex-shrink: 0;
    }
    .item-row:nth-child(1) .item-rank { background: #f1c40f; color: #000; }
    .item-row:nth-child(2) .item-rank { background: #95a5a6; color: #000; }
    .item-row:nth-child(3) .item-rank { background: #cd7f32; color: #000; }
    .item-name {
      flex: 1;
      font-size: 13px;
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .item-price {
      font-size: 14px;
      font-weight: 700;
      color: var(--accent-green);
      white-space: nowrap;
    }

    /* Recent Receipts */
    .receipt-item {
      display: flex;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
      gap: 10px;
    }
    .receipt-item:last-child { border-bottom: none; }
    .receipt-date {
      font-size: 11px;
      color: var(--text-secondary);
      background: var(--bg-secondary);
      padding: 4px 8px;
      border-radius: 6px;
      white-space: nowrap;
    }
    .receipt-store {
      flex: 1;
      font-size: 13px;
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .receipt-total {
      font-size: 15px;
      font-weight: 700;
      color: var(--accent-orange);
      white-space: nowrap;
    }

    /* Loading & Error */
    .loading {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-secondary);
    }
    .loading-spinner {
      width: 36px; height: 36px;
      border: 3px solid var(--border);
      border-top: 3px solid var(--accent-green);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 12px;
    }
    .error {
      background: rgba(231, 76, 60, 0.15);
      border: 1px solid rgba(231, 76, 60, 0.3);
      border-radius: var(--radius);
      padding: 16px;
      color: #e74c3c;
      text-align: center;
      margin-bottom: 14px;
    }
    .empty {
      text-align: center;
      padding: 30px 20px;
      color: var(--text-secondary);
    }
    .empty-icon { font-size: 40px; margin-bottom: 8px; }

    /* Status bar */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: var(--text-secondary);
      margin-bottom: 14px;
      padding: 0 4px;
    }
    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 4px;
    }
    .status-dot.online { background: var(--accent-green); }
    .status-dot.offline { background: #e74c3c; }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <div class="header-icon">🧾</div>
      <div>
        <h1>Мои чеки</h1>
        <div class="subtitle">Дашборд расходов</div>
      </div>
      <button class="refresh-btn" onclick="loadData()" id="refreshBtn">↻</button>
    </div>

    <!-- Status -->
    <div class="status-bar">
      <span><span class="status-dot online" id="statusDot"></span><span id="statusText">Загрузка...</span></span>
      <span id="updateTime"></span>
    </div>

    <!-- Error -->
    <div class="error" id="errorBlock" style="display:none"></div>

    <!-- Loading -->
    <div class="loading" id="loadingBlock">
      <div class="loading-spinner"></div>
      <div>Загружаем данные...</div>
    </div>

    <!-- Dashboard Content -->
    <div id="dashboard" style="display:none">
      <!-- KPI Cards -->
      <div class="kpi-grid">
        <div class="kpi-card green">
          <div class="kpi-label">📄 Чеков</div>
          <div class="kpi-value" id="kpiReceipts">—</div>
        </div>
        <div class="kpi-card orange">
          <div class="kpi-label">💰 Потрачено</div>
          <div class="kpi-value" id="kpiSpent">—</div>
        </div>
      </div>

      <!-- By Store -->
      <div class="section" id="storesSection" style="display:none">
        <div class="section-title"><span class="icon">🏪</span> По магазинам</div>
        <div id="storesList"></div>
      </div>

      <!-- Top Items -->
      <div class="section" id="itemsSection" style="display:none">
        <div class="section-title"><span class="icon">🛒</span> Топ товаров</div>
        <div id="itemsList"></div>
      </div>

      <!-- Recent Receipts -->
      <div class="section" id="recentSection" style="display:none">
        <div class="section-title"><span class="icon">📅</span> Последние чеки</div>
        <div id="recentList"></div>
      </div>

      <!-- Empty State -->
      <div class="empty" id="emptyBlock" style="display:none">
        <div class="empty-icon">📭</div>
        <div>Пока нет чеков</div>
        <div style="font-size:12px;margin-top:4px">Отправьте фото чека боту</div>
      </div>
    </div>
  </div>

  <script>
    // Auto-detect API host: use serveo URL if on GitHub Pages, else use relative path
    const API_HOST = window.API_HOST || (
      window.location.hostname.includes('serveousercontent.com')
        ? window.location.origin
        : window.location.hostname.includes('github.io')
          ? 'https://d9b45d1f64fe5954-91-108-237-231.serveousercontent.com'
          : window.location.origin
    );
    const API_URL = `${API_HOST}/api/stats`;

    // Telegram WebApp init
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      tg.MainButton.setText('🔄 Обновить').show().onClick(() => loadData());
      if (tg.themeParams.bg_color) {
        document.documentElement.style.setProperty('--bg-primary', tg.themeParams.bg_color);
      }
    }

    function formatRub(amount) {
      return Number(amount).toLocaleString('ru-RU') + ' ₽';
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    async function loadData() {
      const refreshBtn = document.getElementById('refreshBtn');
      const loadingBlock = document.getElementById('loadingBlock');
      const dashboard = document.getElementById('dashboard');
      const errorBlock = document.getElementById('errorBlock');
      const statusDot = document.getElementById('statusDot');
      const statusText = document.getElementById('statusText');
      const updateTime = document.getElementById('updateTime');

      refreshBtn.classList.add('spinning');
      errorBlock.style.display = 'none';
      loadingBlock.style.display = 'block';
      dashboard.style.display = 'none';
      statusDot.className = 'status-dot online';
      statusText.textContent = 'Загрузка...';

      try {
        const resp = await fetch(API_URL);
        if (!resp.ok) throw new Error(`HTTP ${resp.status}: ${resp.statusText}`);
        const data = await resp.json();
        renderDashboard(data);

        statusDot.className = 'status-dot online';
        statusText.textContent = 'Онлайн';
        updateTime.textContent = new Date().toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'});
        loadingBlock.style.display = 'none';
        dashboard.style.display = 'block';
      } catch (err) {
        loadingBlock.style.display = 'none';
        dashboard.style.display = 'block';
        errorBlock.style.display = 'block';
        errorBlock.textContent = '⚠️ Не удалось загрузить данные: ' + err.message;
        statusDot.className = 'status-dot offline';
        statusText.textContent = 'Ошибка';
      } finally {
        refreshBtn.classList.remove('spinning');
      }
    }

    function renderDashboard(data) {
      const hasData = data.total_receipts > 0;

      // KPI
      document.getElementById('kpiReceipts').textContent = data.total_receipts || 0;
      document.getElementById('kpiSpent').textContent = formatRub(data.total_spent || 0);

      // Empty state
      document.getElementById('emptyBlock').style.display = hasData ? 'none' : 'block';

      // Stores
      const storesSection = document.getElementById('storesSection');
      const storesList = document.getElementById('storesList');
      if (data.by_store && data.by_store.length > 0) {
        storesSection.style.display = 'block';
        storesList.innerHTML = data.by_store.map(s => {
          const [name, count, total] = s;
          return `<div class="store-item">
            <span class="store-name">${escapeHtml(name)}</span>
            <span class="store-meta">${count} чек.</span>
            <span class="store-total">${formatRub(total)}</span>
          </div>`;
        }).join('');
      } else {
        storesSection.style.display = 'none';
      }

      // Top Items
      const itemsSection = document.getElementById('itemsSection');
      const itemsList = document.getElementById('itemsList');
      if (data.top_items && data.top_items.length > 0) {
        itemsSection.style.display = 'block';
        itemsList.innerHTML = data.top_items.map((item, i) => {
          const [name, count, total] = item;
          return `<div class="item-row">
            <div class="item-rank">${i + 1}</div>
            <span class="item-name">${escapeHtml(name)}</span>
            <span class="item-price">${formatRub(total)}</span>
          </div>`;
        }).join('');
      } else {
        itemsSection.style.display = 'none';
      }

      // Recent
      const recentSection = document.getElementById('recentSection');
      const recentList = document.getElementById('recentList');
      if (data.recent && data.recent.length > 0) {
        recentSection.style.display = 'block';
        recentList.innerHTML = data.recent.map(r => {
          const [date, store, total] = r;
          return `<div class="receipt-item">
            <span class="receipt-date">${escapeHtml(date)}</span>
            <span class="receipt-store">${escapeHtml(store)}</span>
            <span class="receipt-total">${formatRub(total)}</span>
          </div>`;
        }).join('');
      } else {
        recentSection.style.display = 'none';
      }
    }

    // Load on page ready
    document.addEventListener('DOMContentLoaded', loadData);

    // Auto-refresh every 60 seconds
    setInterval(loadData, 60000);
  </script>
</body>
</html>
